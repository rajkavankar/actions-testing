name: "Manual dispatch"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: this is an environment coice
        default: dev
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: "Clone the project"
        run: echo "Checkout project"
  build:
    needs: [checkout]
    runs-on: ubuntu-latest
    steps:
      - name: "build the project"
        run: echo "Build project"
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: "Run tests"
        run: echo "Run test cases"
  deploy:
    if: inputs.environment == 'prod'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: "Deploy project"
        run: echo "Deploy the project"
